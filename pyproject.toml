[project]
name = "katz"
version = "0.2.3"
description = "Version-aware ledger for paper review artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "John Horton" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.1",
  "edsl @ git+https://github.com/expectedparrot/edsl.git@7a3a3399f2b107b9272ab6ade72f3549ed02e2e9",
  "rich>=13.9",
  "typer>=0.23",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
katz = "katz.cli:app"
autokatz = "katz.autokatz:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/katz"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/katz",
  "/tests",
  "/benchmarks/review-quality",
  "/scripts/check-docs.py",
  "/docs/index.html",
  "/docs/investigated-review.html",
  "/docs/review.html",
  "/docs/investigated-report-example.png",
  "/docs/human-triage-survey.png",
  "/README.md",
  "/LICENSE",
  "/AGENTS.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
